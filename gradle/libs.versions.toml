[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycleRuntimeKtx = "2.11.1"
lifecycleViewmodelCompose = "2.11.1"
activityCompose = "1.13.0"
composeBom = "2026.11.01"
navigationCompose = "2.10.2"
koin = "4.2.2"
koinCompose = "4.2.2"
hivemqMqttClient = "1.4.2"
ktor = "3.6.1"
kotlinxSerializationJson = "1.13.0"
datastore = "1.3.0"
biometric = "1.1.0"
fragmentKtx = "1.9.1"
coroutines = "1.11.0"
kotlinxSerializationPlugin = "2.4.21"
junit = "4.13.2"
firebaseBom = "35.2.0"
glance = "1.2.0"
work = "2.12.0"

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
